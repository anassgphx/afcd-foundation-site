# AFCD Studio on the VPS, in /srv/afcd-studio. Separate from AFCD Connect (/opt/afcd):
# its own PostgreSQL, data and networks. Only the Studio app joins the small shared "afcd-edge" network,
# where the front-door Caddy reaches it; Studio cannot see AFCD Connect's app or database.
name: afcd-studio

services:
  studio-pg:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.db
    volumes:
      - studio_pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d afcd_studio"]
      interval: 5s
      timeout: 3s
      retries: 20

  studio-app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      studio-pg:
        condition: service_healthy
    volumes:
      - ./site:/app            # the website checkout Studio publishes into
      - ./data:/data           # Studio data folder: media originals, keys, salts
    networks: [internal, web]
    # GET /studio/api/health: 200 when Studio and its database answer (nothing else is revealed). Docker marks the
    # container unhealthy after 3 failed checks; details for staff are at /studio/api/health/details.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||4400)+'/studio/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  studio_pgdata:

networks:
  internal: {}
  web:
    external: true
    name: afcd-edge          # shared only by the front-door Caddy and Studio
